<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030506" />
  <meta name="color-scheme" content="dark" />
  <title>INVITEA — Sign In</title>
  <meta name="description" content="Sign in or create your INVITEA account to manage invitations and RSVPs." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/landing.css" />
  <style>
    .auth-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 100px max(24px, env(safe-area-inset-right)) 40px max(24px, env(safe-area-inset-left));
    }
    .auth-card {
      width: min(100%, 420px);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(18px);
      padding: 40px 32px;
      box-shadow: 0 32px 100px rgba(0,0,0,0.28);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      color: var(--white-90);
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.04em;
    }
    .auth-logo svg {
      width: 28px;
      height: 28px;
    }
    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--white-50);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }
    .auth-tab.active {
      background: rgba(196,149,106,0.12);
      color: var(--gold-light);
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-form label {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .auth-form label span {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--white-50);
    }
    .auth-form input {
      width: 100%;
      min-height: 48px;
      padding: 14px 16px;
      background: rgba(3,5,6,0.5);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--white-90);
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 300;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .auth-form input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold-glow);
    }
    .auth-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      margin-top: 6px;
      padding: 14px 24px;
      background: var(--gold);
      border: none;
      border-radius: 100px;
      color: #030506;
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
    }
    .auth-submit:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(196,149,106,0.24);
    }
    .auth-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 8px 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--white-08);
    }
    .auth-divider span {
      font-size: 0.68rem;
      color: var(--white-30);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .auth-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 12px 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      color: var(--white-70);
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
    }
    .auth-google:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
    }
    .auth-error {
      min-height: 20px;
      color: #e57373;
      font-size: 0.8rem;
      text-align: center;
      margin-top: 2px;
    }
    .auth-back {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--white-30);
      transition: color 0.3s;
    }
    .auth-back:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="auth-logo">
        <svg viewBox="0 0 36 36" fill="none">
          <path d="M3 12L13 6L23 12V22H3V12Z" stroke="currentColor" stroke-width="1"/>
          <path d="M3 12L13 18L23 12" stroke="currentColor" stroke-width="1"/>
          <path d="M25 3V29" stroke="currentColor" stroke-width="2"/>
          <path d="M21 3H29M21 29H29" stroke="currentColor" stroke-width="1"/>
          <path d="M15 8L16 5.5L17 8L19.5 9L17 10L16 12.5L15 10L12.5 9Z" fill="currentColor" opacity="0.7"/>
        </svg>
        INVITEA
      </a>

      <div class="auth-tabs" id="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="login-form" novalidate>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required placeholder="Your password" />
        </label>
        <button type="submit" class="auth-submit" id="login-btn">Sign In</button>
        <p class="auth-error" id="login-error" role="alert"></p>
      </form>

      <!-- Sign Up Form -->
      <form class="auth-form" id="signup-form" style="display:none" novalidate>
        <label>
          <span>Full Name</span>
          <input type="text" name="displayName" autocomplete="name" required placeholder="Your name" />
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="new-password" required minlength="6" placeholder="Min 6 characters" />
        </label>
        <button type="submit" class="auth-submit" id="signup-btn">Create Account</button>
        <p class="auth-error" id="signup-error" role="alert"></p>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <button class="auth-google" id="google-signin" type="button">
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none">
          <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.3-.2-1.9H9v3.6h4.8c-.2 1.2-.9 2.2-1.9 2.9v2.4h3.1c1.8-1.7 2.8-4.1 2.8-7z"/>
          <path fill="#34A853" d="M9 18c2.6 0 4.7-.9 6.3-2.3l-3.1-2.4c-.9.6-2 .9-3.2.9-2.4 0-4.5-1.6-5.3-3.8H.6v2.5C2.2 15.7 5.3 18 9 18z"/>
          <path fill="#FBBC05" d="M3.7 10.4c-.2-.6-.4-1.3-.4-2s.1-1.4.4-2V3.9H.6C.2 5 0 6.4 0 8s.2 3 .6 4.1l3.1-2.4z"/>
          <path fill="#EA4335" d="M9 3.6c1.4 0 2.6.5 3.6 1.4l2.7-2.7C13.5.9 11.4 0 9 0 5.3 0 2.2 2.3.6 5.9l3.1 2.4c.8-2.2 2.9-3.8 5.3-3.8z"/>
        </svg>
        Continue with Google
      </button>

      <a href="/" class="auth-back">← Back to home</a>
    </div>
  </div>

  <script type="module" src="/firebase-init.js"></script>
  <script type="module" src="/auth.js"></script>
</body>
</html>
